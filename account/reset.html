<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ตั้งรหัสผ่านใหม่ • Road Safety</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:#18324a;font:17px/1.65 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;padding:24px}main{background:white;border-radius:24px;padding:32px;max-width:480px;width:100%;box-shadow:0 15px 50px #23456715}h1{font-size:26px}label,input,button{display:block;width:100%}input{font:inherit;padding:12px;border:1px solid #aebfd0;border-radius:10px;margin:6px 0 18px}button{font:inherit;background:#1764a0;color:white;border:0;border-radius:12px;padding:14px;cursor:pointer}button:disabled{opacity:.55}a{color:#1764a0}#status{white-space:pre-line}small{color:#50677b}[hidden]{display:none!important}</style>
<main><p>🛡️ ROAD SAFETY THAILAND</p><h1>ตั้งรหัสผ่านใหม่</h1><p id="status" role="status" aria-live="polite">กำลังตรวจลิงก์…</p>
<form id="request" hidden><label>อีเมลบัญชีเว็บไซต์<input id="email" name="email" type="email" autocomplete="username" required></label><button>ส่งลิงก์ตั้งรหัสผ่าน</button><small>เปิดอีเมลล่าสุด แล้วตั้งรหัสผ่านบนอุปกรณ์เดียวกัน</small></form>
<form id="reset" hidden><label>รหัสผ่านใหม่<input id="password" name="new-password" type="password" autocomplete="new-password" minlength="12" required></label><label>ยืนยันรหัสผ่านใหม่<input id="confirm" name="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label><small>อย่างน้อย 12 ตัวอักษร ใช้รหัสเฉพาะสำหรับเว็บไซต์นี้</small><button>บันทึกรหัสผ่านใหม่</button></form>
<p><a href="../index.html">กลับหน้าเว็บไซต์</a></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/+esm';
const $=id=>document.getElementById(id),message=t=>$('status').textContent=t;
const client=createClient('https://selohymkkwvldhtohtbm.supabase.co','sb_publishable_mj_tdZov0SpOqkJb5r3ePQ_dtGCpmPT',{auth:{persistSession:false,detectSessionInUrl:true,autoRefreshToken:false,storageKey:'road-password-recovery'}});
let recovery=false;
function ready(session){if(!session)return;recovery=true;$('request').hidden=true;$('reset').hidden=false;history.replaceState(null,'',location.pathname);message('ลิงก์ยืนยันแล้ว กรุณาตั้งรหัสผ่านใหม่ด้วยตนเอง');}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')ready(session);});
try{const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)ready(data.session);else{history.replaceState(null,'',location.pathname);$('request').hidden=false;message('กรอกอีเมลเพื่อรับลิงก์ตั้งรหัสผ่านใหม่ หากลิงก์เดิมหมดอายุให้ขอใหม่ที่นี่');}}catch{history.replaceState(null,'',location.pathname);$('request').hidden=false;message('ลิงก์ไม่ถูกต้องหรือหมดอายุ กรุณาขอลิงก์ใหม่');}
$('request').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:'https://coldwarth-ship-it.github.io/road-safety-app/account/reset.html'});if(error)throw error;message('หากมีบัญชีนี้ ระบบจะส่งลิงก์ตั้งรหัสผ่านให้ กรุณาตรวจกล่องจดหมายและสแปม');}catch{message('ส่งอีเมลไม่ได้ กรุณารอสักครู่แล้วลองใหม่');}finally{button.disabled=false;}};
$('reset').onsubmit=async event=>{event.preventDefault();if(!recovery)return;if($('password').value!==$('confirm').value){message('รหัสผ่านทั้งสองช่องไม่ตรงกัน');return;}const button=event.target.querySelector('button');button.disabled=true;try{const {error}=await client.auth.updateUser({password:$('password').value});if(error)throw error;$('password').value='';$('confirm').value='';$('reset').hidden=true;await client.auth.signOut();message('ตั้งรหัสผ่านใหม่สำเร็จแล้ว ใช้อีเมลและรหัสใหม่นี้เข้าสู่ระบบเจ้าของเว็บไซต์ได้');}catch{message('บันทึกรหัสไม่ได้ กรุณาใช้รหัสอย่างน้อย 12 ตัวอักษร หรือลองขอลิงก์ใหม่');}finally{button.disabled=false;}};
</script></html>
