</style></head><body><div id="game"><canvas id="c"></canvas><div id="riderHud" aria-live="off"><strong id="hudScore">คะแนน 0</strong><span id="hudLives">ชีวิต 3/3</span></div><div id="top"><button class="small" id="pause">พัก</button><button class="small" id="full">เต็มจอ</button></div><div id="tips">มองไกล • เว้นระยะ • หยุดให้คนข้าม</div><div id="controls"><button class="pedal" id="brake" aria-label="เบรก กดค้างเพื่อหยุด"><span class="pedal-icon" aria-hidden="true">■</span><small>เบรก</small></button><div class="steer"><button id="left" aria-label="เลี้ยวซ้าย">◀</button><button id="right" aria-label="เลี้ยวขวา">▶</button></div><button class="pedal accel" id="accel" aria-label="เร่ง เมื่อทางปลอดภัย"><span class="pedal-icon" aria-hidden="true">▲</span><small>เร่ง</small></button></div><div id="missionInfo"></div><div id="footer">ความปลอดภัยในการขับขี่เริ่มต้นจากตัวเรา • SCAN – SLOW – ASSESS – REACT</div><div class="panel" id="panel"><div class="card" id="card"></div></div></div><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');let W=480,H=800,scale=1,ox=0,oy=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t),mod=(a,b)=>(a%b+b)%b;
let mode='menu',z=0,speed=0,x=190,lives=3,time=0,points=0,penalty=0,inv=0,nextEvent=550,nextTraffic=380,events=[],cars=[],objects=[],keys={},input={brake:false,accel:false,left:false,right:false},toast='',toastTime=0,countdown=0,offTime=0,wrongTime=0,nearTime=0,name='',tutorial=false,tutorialStep=0,tutorialWait=0,tutorialStartX=0;
let stats={},held=new Map(),drag=null,last=performance.now();
const palette=['#5685a5','#bd665a','#dec079','#80a590','#d4d7da','#597386'];
function resize(){const priorH=H,w=innerWidth,h=innerHeight;W=480;H=clamp(480*h/w,320,960);z+=(priorH-H)*.25;scale=w/W;cv.width=Math.round(w*Math.min(devicePixelRatio||1,2));cv.height=Math.round(h*Math.min(devicePixelRatio||1,2));g.setTransform(cv.width/W,0,0,cv.height/H,0,0);if(mode==='play')pauseGame();}
addEventListener('resize',resize);
function road(d){const block=Math.floor(d/1500),t=mod(d,1500),widths=[180,300,180,230,300,180],a=widths[mod(block,widths.length)],b=widths[mod(block+1,widths.length)],width=t>1250?lerp(a,b,smooth((t-1250)/250)):a;const m=240+25*Math.sin(d/620)+12*Math.sin(d/1100);return {m,width,left:m-width/2,right:m+width/2,lanes:width>265?4:2,bridge:mod(block,6)===3&&t>250&&t<1050};}
function medianAt(d){const r=road(d),t=mod(d,1500);return r.lanes===4&&!r.bridge&&t>280&&t<1160&&!events.some(e=>['uturn','junction','merge','signal','rightturn','school'].includes(e.kind)&&Math.abs(e.d-d)<110)}
function encounterPose(e){const r=road(e.d),t=e.timer;
 if(e.kind==='rightturn'){const q=smooth(clamp((t-1.4)/3.0,0,1));return {x:lerp(laneX(e.d,'same',r.lanes===4?1:0),r.m+r.width*.20,q),d:e.d+65-Math.sin(q*Math.PI)*65,angle:q*Math.PI/2,opposite:false};}
 if(e.kind==='oncoming'){const q=clamp(t/5,0,1);return {x:r.m+r.width*.25-(r.width*.25+12)*Math.sin(q*Math.PI),d:e.d+200-t*85,angle:0,opposite:true};}
 const q=clamp((t-1)/4,0,1);return {x:lerp(r.m+38,r.m-38,smooth(q)),d:e.d-Math.sin(q*Math.PI)*65+Math.max(0,t-5)*75,angle:Math.PI*q,opposite:true};
}
function laneX(d,side,lane=0){const r=road(d);return r.m+(side==='same'?-1:1)*r.width*(r.lanes===4?(lane===0?.375:.125):.25)}
function weather(){if(sessionType==='mission'&&!tutorial)return STAGES[selectedStage].weather;const stage=Math.floor(z/3600);return stage%3===1?'rain':stage%3===2?'night':'day'}
function score(){return Math.max(0,Math.floor(travelled/16)+points-penalty)}
function difficulty(){return clamp(score()/900,0,1)}
function playerD(){return z+H*.25}
function sy(d){return H*.75-(d-playerD())}
function storage(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
function say(s,d=3){toast=s;toastTime=d;$('tips').textContent=s}
function release(){keys={};for(const k in input)input[k]=false;held.clear();drag=null;document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'))}
function reset(train=false){release();z=0;speed=0;x=laneX(playerD(),'same');lives=3;time=0;points=0;penalty=0;inv=0;offTime=wrongTime=nearTime=0;events=[];cars=[];objects=[];nextEvent=playerD()+500;nextTraffic=playerD()+300;stats={stops:0,safe:0,school:0,signals:0,crashes:0,red:0,wrong:0,tail:0,early:0,water:0};tutorial=train;tutorialStep=0;tutorialWait=0;tutorialStartX=x;mode='play';$('panel').classList.add('hidden');$('pause').textContent='พัก';say(train?'ฝึก 1/3 • ปัดจอ หรือกด ◀ ▶ เพื่อเลี้ยว':'ออกเดินทาง • ขับชิดซ้ายและเว้นระยะ',5);initRound(train)}
function pauseGame(){if(mode!=='play'&&mode!=='countdown')return;mode='pause';release();updateAudio();$('panel').classList.remove('hidden');$('card').innerHTML='<div class="badge">พักเกม</div><h1>พร้อมแล้วค่อยไปต่อ</h1><p>หมุนจอได้ทั้งแนวตั้งและแนวนอน<br>กลับเข้าเกมพร้อมนับถอยหลัง 3 วินาที</p><div class="row"><button class="primary" id="resume">เล่นต่อ</button><button class="small" id="restart">เริ่มใหม่</button><button class="small" id="endRound">จบรอบและบันทึก</button></div>';$('resume').onclick=()=>{unlockAudio();mode='countdown';countdown=3;$('panel').classList.add('hidden');release()};$('restart').onclick=menu;$('endRound').onclick=()=>finish(false);}
$('pause').onclick=pauseGame;$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>say('ใช้โหมดเต็มจอของเบราว์เซอร์ได้ครับ'))}else document.exitFullscreen?.()};
function collision(reason){if(inv||mode!=='play'||tutorial)return;stats.crashes++;lives--;penalty+=35;inv=2;speed=Math.min(speed,30);say(reason+' • −35',3);soundCue('hit');if(prefs.vibration&&navigator.vibrate)navigator.vibrate(90);if(lives<=0)finish()}
function risk(e,key,amount,message){if(e[key])return;e[key]=true;e.failed=true;penalty+=amount;say(message+' • −'+amount,3)}
function award(e,amount){if(e.awarded||e.failed)return;e.awarded=true;points+=amount;stats.safe++;if(e.kind==='school')stats.school++;if(e.kind==='signal')stats.signals++;if(e.wait>.6)stats.stops++;say(e.kind==='school'?'หยุดให้เด็กข้าม +50':e.kind==='signal'?'ตรวจทางแยกก่อนออก +60':e.kind==='puddle'||e.kind==='broken'?'ผ่านพื้นผิวเสี่ยงโดยไม่กดเร่ง +25':'คาดการณ์และผ่านอย่างปลอดภัย +25')}
function spawnEvent(d){
 const sequence=['rightturn','school','oncoming','junction','uturn','merge','signal','dog','junction','door','merge','pothole','cone','broken'];
 const choices=sessionType==='mission'?[...STAGES[selectedStage].hazards,'rightturn','oncoming','junction','merge','uturn']:sequence;let kind=choices[eventsMade++%choices.length];if(weather()==='rain'&&eventsMade%3===0)kind='puddle';
 // Reserve a distinct encounter area, including moving vehicles already on their way.
 const lastEvent=events.reduce((m,e)=>Math.max(m,e.d),-Infinity);d=Math.max(d,lastEvent+620);
 while(cars.some(c=>Math.abs(c.d-d)<330))d+=180;
 if(kind==='uturn'){while(road(d).lanes!==4||road(d).bridge||mod(d,1500)<350||mod(d,1500)>1050||cars.some(c=>Math.abs(c.d-d)<330))d+=80;}
 if(mission&&d>mission.d-430)return mission.d+500;events.push({kind,d,state:'idle',timer:0,wait:0,failed:false,side:Math.random()<.5?-1:1,crossX:0,phase:0,truckX:0,present:kind!=='uturn'||Math.random()<.6});return d;
}
let eventsMade=0;
const resetBase=reset;reset=function(train=false){eventsMade=0;resetBase(train)};
function carPosition(c){let base=laneX(c.d,c.side,c.lane);if(c.side==='same')for(const e of events){const gap=Math.abs(c.d-e.d);if(e.kind==='door'&&gap<220){const r=road(c.d),target=r.lanes===4?laneX(c.d,'same',1):r.m-8;const t=smooth(clamp((220-gap)/100,0,1));base=lerp(base,target,t)}}return base}

function spawnTraffic(d){const side=Math.random()<.52?'same':'opposite',r=road(d),lane=r.lanes===4?(Math.random()<.5?0:1):0;if(mission&&Math.abs(d-mission.d)<400)return;if(events.some(e=>Math.abs(e.d-d)<330))return;if(cars.some(c=>c.side===side&&Math.abs(carPosition(c)-laneX(d,side,lane))<52&&Math.abs(c.d-d)<170))return;cars.push({d,side,lane,v:side==='same'?65+Math.random()*35:75+Math.random()*45,color:palette[Math.floor(Math.random()*palette.length)],brake:false,clock:0,trigger:4+Math.random()*5,blink:Math.random()<.3})}
function updateEvents(dt,oldD,pd){
 for(const e of events){const gap=e.d-pd,r=road(e.d),stop=e.d-75;const trafficClearing=cars.some(c=>Math.abs(c.d-e.d)<135);
  if(e.state==='idle'&&gap<390){e.state='active';e.timer=0;e.crossX=e.side<0?r.left-45:r.right+45;e.truckX=r.left-130;if(e.kind==='school')say('โรงเรียน • เด็กอาจออกจากหลังรถจอด');else if(e.kind==='signal')say('ไฟแดง • หยุดหลังเส้น');else if(e.kind==='door')say('รถจอด • เผื่อระยะประตูเปิด');else if(e.kind==='merge')say('ทางร่วม • ระวังรถรวมเข้าช่องทาง');else if(e.kind==='junction')say('ทางแยกไม่มีสัญญาณ • ชะลอและมองซ้ายขวา');else if(e.kind==='dog')say('ริมทางมีสุนัข • เตรียมเบรก');else if(e.kind==='rightturn')say('รถหน้าเปิดไฟเลี้ยวขวา • เตรียมเบรก');else if(e.kind==='oncoming')say('รถสวนกินเลน • ชะลอและเผื่อช่องหนี');else if(e.kind==='uturn')say('จุดกลับรถ • มองรถรอกลับและเตรียมเบรก');else if(e.kind==='puddle')say('น้ำขังบนถนน • ไม่กดเร่งขณะผ่าน เพื่อรับโบนัส');else if(e.kind==='broken')say('ถนนชำรุด • ไม่กดเร่งขณะผ่าน เพื่อรับโบนัส')}
  if(e.state==='idle'||e.state==='done')continue;
  if(speed<2&&gap>80&&gap<300)e.wait+=dt;
  if(e.kind==='school'){
   if((gap<270||e.timer>0||cars.some(c=>Math.abs(c.d-(e.d-(c.side==='same'?145:-145)))<6))&&(!trafficClearing||e.timer>0))e.timer+=dt;
   if(e.timer>0){e.crossX=lerp(r.left-45,r.right+170,clamp(e.timer/6,0,1));
    // Behaviour violations and physical contact are scored separately.
    if(e.wait>.6&&speed>12&&gap>34&&gap<260&&!e.early){stats.early++;risk(e,'early',25,'ออกตัวก่อนคนข้ามพ้นถนน')}
    if(oldD<e.d-34&&pd>=e.d-34&&speed>2&&!e.early&&!e.crossViolation){stats.early++;risk(e,'crossViolation',25,'ผ่านทางม้าลายก่อนคนข้ามเสร็จ')}
    for(let i=0;i<5;i++){const childX=e.crossX-i*24,childD=e.d-(i%2?10:-8);if(Math.abs(pd-childD)<34&&Math.abs(x-childX)<23&&!e.contacted){e.contacted=true;e.failed=true;collision('ชนคนข้ามถนน')}}
    if(e.timer>=6){e.state='done';if(e.wait>.6)award(e,50);else e.failed=true}
   }
  }else if(e.kind==='signal'){
   if(e.timer<5.95||!trafficClearing||e.phase===1)e.timer+=dt;
   if(e.timer<6){if(oldD<stop&&pd>=stop&&!e.redViolation){stats.red++;risk(e,'redViolation',40,'ฝ่าไฟแดง • หยุดหลังเส้น')}}
   else{if(e.phase===0){e.phase=1;say('ไฟเขียว • ตรวจซ้ายขวา รถบรรทุกฝ่าไฟแดง!')}
    e.truckX=r.left-130+(e.timer-6)*125;
    if(Math.abs(gap)<43&&Math.abs(x-e.truckX)<68&&!e.contacted){e.contacted=true;e.failed=true;collision('รถบรรทุกตัดหน้า')}
    if(e.truckX>r.right+140){e.state='done';if(e.wait>.6)award(e,60)}
   }
  }else if(e.kind==='dog'){
   if((gap<260||e.timer>0)&&(!trafficClearing||e.timer>0))e.timer+=dt;
   e.crossX=e.side<0?r.left-32+e.timer*85:r.right+32-e.timer*85;
   if(e.timer>0&&Math.abs(gap)<25&&Math.abs(x-e.crossX)<32&&!e.failed){e.failed=true;collision('สุนัขวิ่งตัดหน้า')}
   if(e.timer>r.width/85+1)e.state='done';
  }else if(e.kind==='door'){
   if(gap<240)e.timer+=dt;const cx=r.left-1;
   if(Math.abs(gap)<52&&x>cx-27&&x<cx+(e.timer>.6&&e.timer<3.8?73:27)&&!e.failed){e.failed=true;collision('ชนประตูรถ • เว้นระยะรถจอด')}
  }else if(e.kind==='merge'){
   if((gap<290||e.timer>0)&&(!trafficClearing||e.timer>0))e.timer+=dt;const t=clamp(e.timer/3.5,0,1);e.crossX=lerp(r.left-100,laneX(e.d,'same',0),smooth(t));e.carD=e.d+Math.min(155,Math.max(0,e.timer-3.5)*65);if(e.timer>6){e.state='done';if(!e.failed)award(e,25)}

function updateTraffic(dt,np){

  for(let i=0;i<ordered.length;i++){

   let target=c.v;c.brake=!inJunction&&c.clock>c.trigger&&c.clock<c.trigger+2.6;if(c.brake)target=Math.max(15,c.v-65);
   let limit=dir===1?Infinity:-Infinity;
   for(const e of events){

    const stopLine=e.d-dir*145;
    if(eventBlocksTraffic(e)&&dir*(stopLine-old)>=0&&dir*(e.d-old)<340){limit=dir===1?Math.min(limit,stopLine):Math.max(limit,stopLine);c.brake=true}
   }
   let proposed=old+dir*target*dt;
   proposed=dir===1?Math.min(proposed,limit):Math.max(proposed,limit);
   const cx=carPosition({...c,d:proposed});
   for(let j=0;j<i;j++){
    const leader=ordered[j];
    // Check both present and approaching road widths, so two lanes cannot overlap at a narrowing.
    const lateral=Math.min(Math.abs(cx-carPosition(leader)),Math.abs(carPosition({...c,d:leader.d})-carPosition(leader)));

   }
   // Repair an overlapping pair once, by placing the follower behind its leader.
   c.d=proposed;c.actualV=Math.abs(c.d-old)/dt;if(c.actualV<c.v*.65)c.brake=true;
   const gap=c.d-np;
   if(side==='same'&&gap>55&&gap<145&&Math.abs(carPosition(c)-x)<32&&speed>(c.actualV||0)+15){nearTime+=dt;if(nearTime>2){stats.tail++;penalty+=10;nearTime=0;say('จี้ท้ายรถหน้า • เว้นระยะ −10')}}

  }
 }
}

const STAGES=[{name:'เขตโรงเรียน',theme:1,weather:'day',hazards:['school','dog','signal']},{name:'ย่านตลาด',theme:2,weather:'day',hazards:['door','junction','cone','school']},{name:'หน้าหมู่บ้าน',theme:1,weather:'day',hazards:['merge','dog','junction','broken']},{name:'ถนนใหญ่',theme:4,weather:'day',hazards:['signal','merge','door','pothole']},{name:'เส้นทางฝนตก',theme:0,weather:'rain',hazards:['puddle','broken','signal','dog']},{name:'เส้นทางกลางคืน',theme:3,weather:'night',hazards:['junction','door','school','pothole']}];
const BIKE_SKINS=[{id:'red',label:'แดงมาตรฐาน',color:'#ce4a42',cost:0},{id:'blue',label:'ฟ้า SSAR',color:'#3d8dc3',cost:0},{id:'gold',label:'เหลืองสดใส',color:'#e7b749',cost:0},{id:'violet',label:'ม่วงเข้ม',color:'#8b69bc',cost:0}];
const SUIT_SKINS=[{id:'green',label:'เขียวมาตรฐาน',color:'#287a79',cost:0},{id:'navy',label:'น้ำเงิน',color:'#355d8c',cost:0},{id:'orange',label:'ส้มสะท้อนแสง',color:'#ec9851',cost:0}];
const MEDALS=[{id:'delivery',name:'ส่งของปลอดภัย',rule:p=>p.deliveries>=1},{id:'yield',name:'หยุดให้ทาง 5 ครั้ง',rule:p=>p.stops>=5},{id:'clean',name:'จบรอบไร้อุบัติเหตุ',rule:p=>p.clean>=1},{id:'all',name:'ครบ 6 เส้นทาง',rule:p=>p.completed.length>=6},{id:'scan',name:'ผ่านเหตุปลอดภัย 20 ครั้ง',rule:p=>p.safe>=20}];
let profile=null,selectedStage=0,sessionType='mission',mission=null,travelled=0,roundId='',roundSaved=false,roundStart=0;
let audio=null,engine=null,engineGain=null,rainGain=null,brakeGain=null;
let prefs=storage('ssar_settings',{sound:false,vibration:true});
function blankProfile(){return {version:1,xp:0,wallet:0,deliveries:0,stops:0,safe:0,clean:0,best:0,completed:[],medals:[],owned:['red','blue','gold','violet','green','navy','orange'],bike:'red',suit:'green'}}
function loadProfile(){profile={...blankProfile(),...storage('ssar_profile_v1',{})};for(const k of ['completed','medals','owned'])if(!Array.isArray(profile[k]))profile[k]=blankProfile()[k];profile.owned=[...new Set([...profile.owned,...BIKE_SKINS.map(i=>i.id),...SUIT_SKINS.map(i=>i.id)])];return profile}
function storeProfile(){try{localStorage.setItem('ssar_profile_v1',JSON.stringify(profile))}catch{say('พื้นที่เครื่องเต็ม • ยังบันทึกความก้าวหน้าไม่ได้')}}
function level(){return profile.xp>=3000?'ไรเดอร์มืออาชีพ':profile.xp>=1000?'ไรเดอร์ชำนาญ':'ไรเดอร์มือใหม่'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectedColor(list,id){return (list.find(s=>s.id===id)||list[0]).color}
function settingsMarkup(){return `<div class="row"><button class="small" id="sound">เสียง ${prefs.sound?'เปิด':'ปิด'}</button><button class="small" id="vibe">แรงสั่น ${prefs.vibration?'เปิด':'ปิด'}</button></div>`}
function bindSettings(){const save=()=>{try{localStorage.setItem('ssar_settings',JSON.stringify(prefs))}catch{}};if($('sound'))$('sound').onclick=()=>{prefs.sound=!prefs.sound;save();if(prefs.sound)unlockAudio();$('sound').textContent='เสียง '+(prefs.sound?'เปิด':'ปิด');updateAudio()};if($('vibe'))$('vibe').onclick=()=>{prefs.vibration=!prefs.vibration;save();$('vibe').textContent='แรงสั่น '+(prefs.vibration?'เปิด':'ปิด');if(prefs.vibration)navigator.vibrate?.(35)}}
function unlockAudio(){if(!prefs.sound)return;try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();engine=audio.createOscillator();engine.type='sawtooth';engineGain=audio.createGain();engineGain.gain.value=0;engine.connect(engineGain).connect(audio.destination);engine.start();const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.25;const noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1400;rainGain=audio.createGain();rainGain.gain.value=0;noise.connect(filter).connect(rainGain).connect(audio.destination);noise.start();const brakeFilter=audio.createBiquadFilter();brakeFilter.type='highpass';brakeFilter.frequency.value=2200;brakeGain=audio.createGain();brakeGain.gain.value=0;noise.connect(brakeFilter).connect(brakeGain).connect(audio.destination)}audio.resume().catch(()=>{})}catch{prefs.sound=false}}
function updateAudio(){if(!audio)return;const active=mode==='play'&&prefs.sound;engineGain.gain.setTargetAtTime(active?.013:0,audio.currentTime,.1);engine.frequency.setTargetAtTime(32+speed*.30,audio.currentTime,.1);rainGain.gain.setTargetAtTime(active&&weather()==='rain'?.075:0,audio.currentTime,.1);brakeGain.gain.setTargetAtTime(active&&(input.brake||keys.ArrowDown||keys[' '])&&speed>15?.022:0,audio.currentTime,.08)}
function soundCue(type){if(!prefs.sound||!audio)return;try{const o=audio.createOscillator(),gain=audio.createGain();o.type=type==='horn'?'square':'sine';o.frequency.value=type==='hit'?95:type==='horn'?350:type==='sirenHi'?1100:type==='sirenLo'?750:660;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.23);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}catch{}}
function garage(){loadProfile();$('card').innerHTML=`<div class="badge">รถและชุด • สมรรถนะเท่ากันทุกสี</div><h1>เลือกสีรถและชุด</h1><p class="compact">เปิดให้เลือกทุกสีตั้งแต่แรก • ไม่ใช้แต้ม</p><div id="items">${[...BIKE_SKINS,...SUIT_SKINS].map(item=>{const own=profile.owned.includes(item.id),chosen=profile.bike===item.id||profile.suit===item.id;return `<button class="skin" data-skin="${item.id}" ${!own&&profile.wallet<item.cost?'disabled':''}><span class="swatch" style="background:${item.color}"></span>${item.label}<small>${chosen?'ใช้อยู่':own?'เลือกใช้':item.cost+' แต้ม'}</small></button>`}).join('')}</div><div class="row"><button class="primary" id="back">กลับหน้าหลัก</button></div>`;document.querySelectorAll('[data-skin]').forEach(btn=>btn.onclick=async()=>{const item=[...BIKE_SKINS,...SUIT_SKINS].find(i=>i.id===btn.dataset.skin);if(CLOUD_CONFIG&&cloudUser){try{btn.disabled=true;const data=await cloudCall('equip',{item:item.id});profile={...blankProfile(),...data.profile};storeProfile();garage()}catch{btn.disabled=false;say('เปลี่ยนสีออนไลน์ไม่สำเร็จ กรุณาลองใหม่')}return}if(!profile.owned.includes(item.id)){if(profile.wallet<item.cost)return;profile.wallet-=item.cost;profile.owned.push(item.id)}profile[BIKE_SKINS.includes(item)?'bike':'suit']=item.id;storeProfile();garage()});$('back').onclick=menu}
function medalScreen(){loadProfile();$('card').innerHTML=`<div class="badge">${level()}</div><h1>เหรียญและเส้นทาง</h1><div class="medal-list">${MEDALS.map(m=>`<div class="medal ${profile.medals.includes(m.id)?'earned':''}"><strong>${profile.medals.includes(m.id)?'ได้รับแล้ว':'รอปลดล็อก'}</strong> ${m.name}</div>`).join('')}</div><p>${STAGES.map((s,i)=>`${profile.completed.includes(i)?'ผ่านแล้ว':'ยังไม่ผ่าน'} • ${s.name}`).join('<br>')}</p><div class="row"><button class="primary" id="back">กลับหน้าหลัก</button></div>`;$('back').onclick=menu}
function initRound(train){travelled=0;roundSaved=false;roundId=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);roundStart=Date.now();mission=sessionType==='mission'&&!train?{d:playerD()+2600,hold:0,warned:false}:null;updateMissionText();if(!train){say(sessionType==='mission'?'รับงาน • '+STAGES[selectedStage].name+' • จอดในช่องส่งของเมื่อถึง':'ขับต่อเนื่อง • คะแนนดีมาจากความปลอดภัย',4);cloudStartRound()}}
function updateMissionText(){const el=$('missionInfo');if(!el)return;el.textContent=tutorial?'ฝึกควบคุมรถ':mission?`${STAGES[selectedStage].name} • อีก ${Math.max(0,Math.ceil(mission.d-playerD()))} ม.`:'ขับต่อเนื่อง • เก็บคะแนนปลอดภัย'}
function deliveryArea(){if(!mission)return null;const r=road(mission.d);return {x:r.left-26,d:mission.d,w:54,h:118}}
function inDeliveryArea(){const a=deliveryArea();return a&&Math.abs(playerD()-a.d)<42&&Math.abs(x-a.x)<18}
function updateMission(dt){travelled+=speed*dt;updateMissionText();if(!mission)return;const gap=mission.d-playerD();if(gap<440&&!mission.warned){mission.warned=true;say('ใกล้จุดส่งของ • ชะลอและเข้าช่องจอดด้านซ้าย',5)}if(inDeliveryArea()&&speed<2){mission.hold+=dt;if(mission.hold>=1.2)finish(true)}else mission.hold=0;if(gap< -120){penalty+=20;say('เลยจุดจอด • −20 • ไปจุดส่งของถัดไป',4);mission.d+=900;mission.warned=false;events=events.filter(e=>Math.abs(e.d-mission.d)>330)}}
function finish(delivered=false){if(roundSaved)return;roundSaved=true;mode='over';release();updateAudio();loadProfile();const clean=delivered&&stats.crashes===0&&penalty===0,deliveryBonus=delivered?100+(clean?100:0):0;points+=deliveryBonus;const result=score(),gain=Math.floor(result*.35),newMedals=[];profile.xp+=result;profile.wallet+=gain;profile.best=Math.max(profile.best,result);profile.stops+=stats.stops;profile.safe+=stats.safe;if(delivered){profile.deliveries++;if(!profile.completed.includes(selectedStage))profile.completed.push(selectedStage);if(clean)profile.clean++}for(const medal of MEDALS)if(!profile.medals.includes(medal.id)&&medal.rule(profile)){profile.medals.push(medal.id);newMedals.push(medal.name)}storeProfile();const a=storage('rg_s_v2',[]);a.push({n:name,s:result});a.sort((a,b)=>b.s-a.s);try{localStorage.setItem('rg_s_v2',JSON.stringify(a.slice(0,20)))}catch{}const tips=[];if(stats.red)tips.push('SLOW • หยุดหลังเส้นเมื่อไฟแดง');if(stats.wrong)tips.push('ASSESS • เลือกฝั่งซ้ายและระวังรถสวน');if(stats.tail)tips.push('SLOW • เพิ่มระยะจากรถหน้า');if(stats.early)tips.push('REACT • รอให้คนข้ามพ้นถนนก่อนออกตัว');if(stats.water)tips.push('SLOW • ชะลอก่อนน้ำขังและถนนชำรุด');if(stats.crashes)tips.push('SCAN • มองจุดบอดและไฟเบรกล่วงหน้า');if(!tips.length)tips.push('ทำได้ดีครับ • รักษาการหยุดรอและเว้นระยะต่อไป');$('panel').classList.remove('hidden');$('card').innerHTML=`<div class="menu-head"><img class="sharky" src="${SHARKY_ASSET}" alt="พี่ชาร์คกี้"><div><div class="badge">พี่ชาร์คกี้ • ${delivered?'ส่งของสำเร็จ':'สรุปรอบ'}</div><h1>คะแนน ${result}</h1><p class="compact">โบนัสส่งของ ${deliveryBonus} • แต้มสะสม +${gain}<br>${level()}</p></div></div><p class="compact">หยุดรอปลอดภัย ${stats.stops} ครั้ง • ผ่านเหตุปลอดภัย ${stats.safe} ครั้ง<br>ชน / หลุดถนน ${stats.crashes} ครั้ง</p><p>${tips.join('<br>')}</p>${newMedals.length?'<p class="new-medal">เหรียญใหม่ • '+newMedals.join(' / ')+'</p>':''}<p class="compact" id="syncResult">${cloudStatus()}</p><p class="compact">ความปลอดภัยในการขับขี่เริ่มต้นจากตัวเรา<br>SCAN – SLOW – ASSESS – REACT</p><div class="row"><button class="primary" id="again">${delivered&&selectedStage<5?'เส้นทางถัดไป':'เล่นอีกครั้ง'}</button><button class="small" id="home">หน้าหลัก</button></div>`;$('again').onclick=()=>{if(delivered&&selectedStage<5)selectedStage++;unlockAudio();reset(false)};$('home').onclick=menu;soundCue('award');queueRound({id:roundId,nickname:name,stage:selectedStage,type:sessionType,distance:Math.floor(travelled),elapsed:Math.floor(time),safe:stats.safe,stops:stats.stops,crashes:stats.crashes,penalty,delivered,client_score:result,stats:{...stats},version:4})}
function drawDelivery(){const a=deliveryArea();if(!a)return;const y=sy(a.d);if(y< -180||y>H+180)return;rr(a.x-a.w/2,y-a.h/2,a.w,a.h,6,'#376d68');g.setLineDash([7,5]);g.strokeStyle='#d5efb8';g.lineWidth=2;g.strokeRect(a.x-a.w/2+5,y-a.h/2+5,a.w-10,a.h-10);g.setLineDash([]);g.textAlign='center';g.font='bold 12px sans-serif';g.fillStyle='#fff0be';g.fillText('จอดส่ง',a.x,y-20);g.fillText('ของ',a.x,y-3);rr(a.x-9,y+14,18,16,2,'#d8b174');line(a.x,y+14,a.x,y+30,'#84683f',2);if(mission.hold>0){g.fillStyle='#ffce65';g.fillRect(a.x-a.w/2,y+a.h/2+5,a.w*clamp(mission.hold/1.2,0,1),5)}}
function drawClues(){for(const e of events){const gap=e.d-playerD(),r=road(e.d),y=sy(e.d);if(gap< -180||gap>H*.75+50)continue;if(e.kind==='school'&&e.state!=='done'&&e.timer<.7){const bx=r.left-15+Math.max(0,e.timer)*35;ellipse(bx,y+7,8,8,'#ec8751');line(bx-6,y+7,bx+6,y+7,'#eacf77',2)}if(e.kind==='dog'&&e.timer===0){line((e.side<0?r.left-35:r.right+35)-10,y-30,(e.side<0?r.left-35:r.right+35)-4,y-38,'#e3c577',2)}if(e.kind==='door'&&e.timer<.6){ellipse(r.left-3,y-9,5,5,'#d7a781');rr(r.left-22,y+20,5,5,1,Math.sin(time*9)>0?'#f4b34a':'#6e5b3a')}if(['junction','merge'].includes(e.kind)&&e.state==='active'&&!e.soundPlayed){e.soundPlayed=true;soundCue('horn')}}}

const CLOUD_CONFIG=window.SSAR_CLOUD||null;
let cloudClient=null,cloudUser=null,cloudReceipt=null,cloudBusy=false,cloudProblem='';
function cloudStatus(){if(!CLOUD_CONFIG)return 'ฉบับทดสอบ • ความก้าวหน้าเก็บในเครื่อง • ยังไม่เชื่อมคะแนนออนไลน์';if(cloudProblem)return cloudProblem;return cloudUser?'เชื่อมบัญชีแล้ว • ผลรอบจะตรวจและบันทึกออนไลน์':'ใส่ชื่อแล้วเล่นได้เลย • เก็บคะแนนออนไลน์อัตโนมัติ';}
async function getCloud(){if(!CLOUD_CONFIG)return null;if(cloudClient)return cloudClient;if(!/^https:\/\//.test(CLOUD_CONFIG.url)||!CLOUD_CONFIG.key)throw Error('ตั้งค่าระบบออนไลน์ไม่ครบ');if(/^sb_secret_/.test(CLOUD_CONFIG.key))throw Error('ห้ามใช้กุญแจผู้ดูแลในตัวเกม');const sdk=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/+esm');cloudClient=sdk.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'ssar-game-session-v1'}});const {data}=await cloudClient.auth.getSession();cloudUser=data.session?.user||null;cloudClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null});return cloudClient}
async function cloudCall(op,payload={}){const client=await getCloud();if(!client)throw Error('ยังไม่เชื่อมระบบออนไลน์');const {data,error}=await client.functions.invoke('game-api',{body:{op,...payload}});if(error)throw Error('ติดต่อระบบคะแนนไม่ได้ กรุณาลองใหม่');if(data?.error)throw Error(data.error);return data}
async function cloudStartRound(){cloudReceipt=null;if(!CLOUD_CONFIG)return;const id=roundId;try{const client=await getCloud();if(!cloudUser){const {data,error}=await client.auth.signInAnonymously();if(error)throw error;cloudUser=data.user}const data=await cloudCall('start',{round_id:id,stage:selectedStage,type:sessionType,nickname:name});if(roundId===id)cloudReceipt={...data,user_id:cloudUser.id}}catch{cloudProblem='รอบนี้ยังไม่เริ่มบันทึกออนไลน์ • เล่นฝึกในเครื่องได้';}}
function queueRound(result){const local=storage('ssar_history',[]);local.unshift({...result,recorded_at:new Date().toISOString()});try{localStorage.setItem('ssar_history',JSON.stringify(local.slice(0,30)))}catch{}if(!cloudReceipt){if($('syncResult'))$('syncResult').textContent=CLOUD_CONFIG?'บันทึกในเครื่อง • รอบนี้ยังไม่ยืนยันออนไลน์':cloudStatus();return}const item={...result,receipt:cloudReceipt,user_id:cloudReceipt.user_id};const queue=storage('ssar_outbox',[]);if(!queue.some(r=>r.id===item.id))queue.push(item);try{localStorage.setItem('ssar_outbox',JSON.stringify(queue))}catch{cloudProblem='บันทึกผลรอส่งไม่ได้ • กรุณาอย่าปิดเกม'}syncOutbox()}
async function syncOutbox(){if(cloudBusy||!CLOUD_CONFIG)return;cloudBusy=true;try{await getCloud();if(!cloudUser)return;const queue=storage('ssar_outbox',[]);for(const item of queue.filter(r=>r.user_id===cloudUser.id)){try{const data=await cloudCall('submit',{result:item});const remaining=storage('ssar_outbox',[]).filter(r=>r.id!==item.id);localStorage.setItem('ssar_outbox',JSON.stringify(remaining));if(data.profile){profile={...blankProfile(),...data.profile};storeProfile()}if($('syncResult'))$('syncResult').textContent='บันทึกออนไลน์สำเร็จ • คะแนนยืนยัน '+data.score;cloudProblem=''}catch{cloudProblem='ผลรอบรอส่ง • กดส่งซ้ำเมื่อเน็ตกลับมา';if($('syncResult'))$('syncResult').textContent=cloudProblem;break}}}finally{cloudBusy=false}}
async function bootstrapCloud(){if(!CLOUD_CONFIG)return;try{await getCloud();if(cloudUser){const data=await cloudCall('progress');profile={...blankProfile(),...data.profile};storeProfile();if(mode==='menu')menu();await syncOutbox()}}catch{cloudProblem='ติดต่อระบบออนไลน์ไม่ได้ • เล่นฝึกในเครื่องได้'}}
if(typeof window.addEventListener==='function')window.addEventListener('online',()=>syncOutbox());
